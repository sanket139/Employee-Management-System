spring.application.name=employee-management-backend

# ==============================
# MySQL Database Configuration
# ==============================
spring.datasource.url=jdbc:mysql://localhost:3306/employee_management?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==============================
# JPA / Hibernate
# ==============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# ==============================
# Server
# ==============================
server.port=8080

# ==============================
# JWT Configuration
# ==============================
# 256-bit+ base64 secret. Replace in production; this is a sample dev-only key.
app.jwt.secret=ZW1wbG95ZWVtYW5hZ2VtZW50c3lzdGVtc3VwZXJzZWNyZXRrZXlmb3Jqd3R0b2tlbmdlbmVyYXRpb24xMjM0NTY=
app.jwt.expiration-ms=86400000

# ==============================
# CORS
# ==============================
app.cors.allowed-origin=http://localhost:5173

# ==============================
# Logging
# ==============================
logging.level.org.springframework.security=INFO
logging.level.com.employeemanagement=DEBUG
